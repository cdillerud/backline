# Disposable, synthetic-only authenticated collaboration preview.
# Create the separate Fly app and set BACKLINE_DEMO_PASSWORD as a Fly secret
# BEFORE deploying. Never attach a volume or reuse an existing database.
app = 'backline-auth-demo'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  BACKLINE_DB = '/data/backline.db'
  BACKLINE_DEMO_SEED = '1'
  BACKLINE_DEMO_ACCOUNTS = '1'
  BACKLINE_ACCOUNTS_ENABLED = '1'
  BACKLINE_PUBLIC_SHARING_ENABLED = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
