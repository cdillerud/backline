# fly.toml app configuration file generated for backline on 2026-10-25T17:12:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backline'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  BACKLINE_DB = '/data/backline.db'

[[mounts]]
  source = 'backline_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
