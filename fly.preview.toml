# Dedicated visual preview: no production app, secrets, or volume.
app = 'backline-visual-preview'
primary_region = 'ord'
[build]
  dockerfile = 'Dockerfile'
[env]
  BACKLINE_DB = '/data/backline-preview.db'
  BACKLINE_ACCOUNTS_ENABLED = '0'
  BACKLINE_AI_COPY_ENABLED = '0'
  BACKLINE_MARKET_DISCOVERY_ENABLED = '0'
  BACKLINE_DEMO_SEED = '1'
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'
[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
