name: Backline CI
on:
  push:
  pull_request:
concurrency:
  group: backline-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        timeout-minutes: 10
        run: python -m playwright install --only-shell chromium
      - name: Fast frontend syntax gate
        run: |
          node --check src/static/app.js
          node --check src/static/workspace.js
          node --check src/static/gigday.js
      - name: Authenticated demo acceptance tests
        timeout-minutes: 6
        run: BACKLINE_LOCAL_DEV=1 python -m pytest -vv -x -s tests/test_demo_accounts.py tests/test_demo_browser.py
      - name: Responsive Gig Day and on-stage browser acceptance
        timeout-minutes: 8
        run: BACKLINE_LOCAL_DEV=1 python -m pytest -vv -x tests/test_browser_gigday_mobile.py tests/test_browser_performance_mobile.py
      - name: Six-workspace authenticated mobile and desktop acceptance
        timeout-minutes: 8
        run: BACKLINE_LOCAL_DEV=1 python -m pytest -vv -x tests/test_browser_workspace_navigation.py
      - name: Archive synthetic responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gigday-responsive-synthetic
          path: artifacts/gigday/
          if-no-files-found: ignore
          retention-days: 7
      - name: Complete regression suite
        timeout-minutes: 18
        run: BACKLINE_LOCAL_DEV=1 python -m pytest -vv -x --ignore=tests/test_demo_accounts.py --ignore=tests/test_demo_browser.py --ignore=tests/test_browser_gigday_mobile.py --ignore=tests/test_browser_performance_mobile.py --ignore=tests/test_browser_workspace_navigation.py
      - name: Stale workspace request isolation regression
        run: node tests/test_workspace_async_guards.cjs
      - name: Calendar async isolation regression
        run: node tests/test_calendar_async_guards.cjs
      - run: node --check src/static/app.js
      - run: node --check src/static/workspace.js
      - run: node --check src/static/gigday.js
      - name: Check collaboration, media, sharing and PWA scripts
        run: |
          node --check src/static/collaboration.js
          node --check src/static/media.js
          node --check src/static/sharing.js
          node --check src/static/pwa.js
          node --check src/static/operations.js
          node --check src/static/service-worker.js
      - name: Validate release PowerShell syntax
        run: |
          pwsh -NoProfile -Command '$tokens=$null; $parseErrors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/deploy-auth-demo.ps1",[ref]$tokens,[ref]$parseErrors); if($parseErrors){$parseErrors | ForEach-Object { Write-Error $_ }; exit 1}'
      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q src
