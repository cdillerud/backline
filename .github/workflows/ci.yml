name: Backline CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        timeout-minutes: 10
        run: python -m playwright install --with-deps --only-shell chromium
      - run: BACKLINE_LOCAL_DEV=1 python -m pytest -q
      - run: node --check src/static/app.js
      - run: node --check src/static/workspace.js
      - name: Check collaboration, media, sharing and PWA scripts
        run: |
          node --check src/static/collaboration.js
          node --check src/static/media.js
          node --check src/static/sharing.js
          node --check src/static/pwa.js
          node --check src/static/operations.js
          node --check src/static/service-worker.js
      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q src
